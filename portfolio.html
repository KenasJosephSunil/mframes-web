<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio — Kevin Joseph Sunil · M Frames</title>
<meta name="description" content="The creative portfolio of Kevin Joseph Sunil — filmmaker, videographer and editor, founder of M Frames." />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..800&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="img/favicon.png" />
<link rel="stylesheet" href="styles.css" />
<style>
  .pf-frame{display:block;width:100%;height:calc(100vh - 78px);margin-top:78px;border:0;background:#0c0c0c}
</style>
</head>
<body>
<div class="grain"></div>
<div class="cursor" id="cursor"><span class="dot"></span></div>

<header id="header" class="solid">
  <div class="wrap nav">
    <a href="index.html" class="brand"><img class="mark" src="img/mark.png" alt="M Frames" /><span class="brand-tx"><b>M&nbsp;FRAMES</b><span>Production House</span></span></a>
    <nav class="nav-links" id="menu"><a href="index.html" class="lnk">Home</a><a href="studio.html" class="lnk">About</a><a href="work.html" class="lnk">Portfolio</a><a href="services.html" class="lnk">Services</a><a href="contact.html" class="lnk">Contact</a><a href="contact.html" class="btn">Book a project ↗</a></nav>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<iframe class="pf-frame" src="https://kevin-portfolio-phi-six.vercel.app" loading="lazy" allow="autoplay; fullscreen"></iframe>

<script src="site.js"></script>
<script>
(function(){
  var c = document.getElementById('cursor');
  var frame = document.querySelector('.pf-frame');
  if(!c || !frame) return;
  var hide = function(){ c.style.opacity = '0'; };
  hide();
  frame.addEventListener('mouseenter', function(){ hide(); try{ frame.contentWindow.postMessage('mf-cursor-show','*'); }catch(e){} });
  frame.addEventListener('mouseleave', function(){ try{ frame.contentWindow.postMessage('mf-cursor-hide','*'); }catch(e){} });
  document.addEventListener('mousemove', function(){ c.style.opacity = '1'; });
  document.documentElement.addEventListener('mouseleave', hide);
  window.addEventListener('blur', hide);
})();
</script>
</body>
</html>
